<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" type="image/svg+xml" href="/SVG LOGO.svg" />
    
    <!-- SEO: meta description (fixes "Document does not have a meta description") -->
    <meta name="description" content="STEM AI Trainers connects enterprises with world-class domain experts for AI training, RLHF, model evaluation, and synthetic data generation across 30+ countries." />
    <meta name="keywords" content="AI training, RLHF, model evaluation, synthetic data, STEM experts, AI annotation" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:title" content="STEM AI Trainers — The Human Reasoning Behind Frontier AI" />
    <meta property="og:description" content="Enterprise AI training operations powered by world-class domain experts across 30+ countries." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stemaitrainers.com/" />

    <!-- FIX: Google Fonts loaded asynchronously (was render-blocking, saves 180ms) -->
    <!-- preconnect tells browser to open the connection early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- preload + onload trick: font loads async without blocking render -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Fallback for JS-disabled browsers -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>STEM AI Trainers — Human Reasoning Behind Frontier AI</title>

    <!-- Theme init: runs before paint to avoid flash -->
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('vaidik-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (localTheme === 'dark' || (!localTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
